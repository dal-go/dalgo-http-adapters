overrides:
  "@dalgo/http>@dalgo/core": "0.8.0"
  "@dalgo/d1>@dalgo/core": "0.8.0"
  "@dalgo/firestore>@dalgo/core": "0.8.1"
  "@dal-go/dalgo": "npm:@dalgo/core@0.8.1"
  "@dalgo/bigquery>@dalgo/core": "0.8.1"
  "@dalgo/core": "0.8.1"
  "@dalgo/indexeddb>@dalgo/core": "0.8.0"
