  "@dalgo/adapter-runtime>@dalgo/core": "0.8.1"
  "@dalgo/dalgo2couchdb>@dalgo/core": "0.8.1"
  "@dalgo/dalgo2libsql>@dalgo/core": "0.8.1"
  "@dalgo/dalgo2postgrest>@dalgo/core": "0.8.1"
  "@dalgo/dalgo2typesense>@dalgo/core": "0.8.1"
