name: Release packages

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged version-PR commit SHA to retry publishing
        required: false
        type: string

permissions: {}

concurrency:
  group: release-packages-main
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_sha == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Create or update the version PR and dispatch its CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit | grep -q .; then
            echo 'No pending changesets'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C changeset-release/main
          pnpm exec changeset version
          pnpm install --lockfile-only
          git add .changeset packages pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No version changes'
            exit 0
          fi
          git commit -m 'chore: version DALgo adapters'
          if git ls-remote --exit-code --heads origin changeset-release/main >/dev/null; then
            git fetch origin changeset-release/main
            previous=$(git rev-parse FETCH_HEAD)
            git push --force-with-lease="refs/heads/changeset-release/main:$previous" origin HEAD:refs/heads/changeset-release/main
          else
            git push origin HEAD:refs/heads/changeset-release/main
          fi
          pr=$(gh pr list --head changeset-release/main --base main --state open --json number --jq '.[0].number')
          if [[ -z "$pr" ]]; then
            gh pr create --head changeset-release/main --base main --title 'chore: version DALgo adapters' --body 'Review the independent package versions, changelogs, and dependency ranges before merging.'
          fi
          gh workflow run ci.yml --ref changeset-release/main

  publish:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'changeset-release/main' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_sha != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Verify merged version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.release_sha || github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          prs=$(gh api "/repos/$REPOSITORY/commits/$SOURCE_SHA/pulls")
          jq -e '[.[] | select(
            .merged_at != null and
            .merge_commit_sha == $sha and
            .base.ref == "main" and
            .head.ref == "changeset-release/main" and
            .head.repo.full_name == $repo
          )] | length == 1' --arg sha "$SOURCE_SHA" --arg repo "$REPOSITORY" <<< "$prs" >/dev/null
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.11.0
      - run: pnpm install --frozen-lockfile
      - name: Check published adapters
        run: |
          pnpm --filter @dalgo/firestore check
          pnpm --filter @dalgo/indexeddb check
      - name: Publish changed versions and tag their npm source commits
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for package in firestore indexeddb; do
            manifest="packages/$package/package.json"
            name=$(jq -r '.name' "$manifest")
            version=$(jq -r '.version' "$manifest")
            previous_version=$(git show "HEAD^:$manifest" | jq -r '.version')
            [[ "$name" == "@dalgo/$package" ]]
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            if [[ "$version" == "$previous_version" ]]; then
              continue
            fi
            if ! npm view "$name@$version" version --json >/dev/null 2>&1; then
              (cd "packages/$package" && npm publish --access public --provenance --registry=https://registry.npmjs.org)
            fi
            metadata=''
            for attempt in {1..20}; do
              if metadata=$(npm view "$name@$version" name version gitHead --json 2>/dev/null); then
                break
              fi
              echo "Waiting for npm metadata for $name@$version (attempt $attempt)" >&2
              sleep 15
            done
            [[ "$(jq -r '.name' <<< "$metadata")" == "$name" ]]
            [[ "$(jq -r '.version' <<< "$metadata")" == "$version" ]]
            [[ "$(jq -r '.gitHead' <<< "$metadata")" == "$source_sha" ]]
            tag="$package@v$version"
            git fetch origin tag "$tag" 2>/dev/null || true
            if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
              [[ "$(git rev-list -n 1 "$tag")" == "$source_sha" ]]
              continue
            fi
            git tag -a "$tag" "$source_sha" -m "$name $version"
            git push origin "refs/tags/$tag"
          done
