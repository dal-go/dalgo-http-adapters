name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check release workflow policy handoff and package selection
        run: python3 .github/scripts/test-release-workflow.py
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check HTTP immutable release artifact guards
        run: python3 .github/scripts/test-http-release.py
      - name: Check OVDB immutable release artifact guards
        run: |
          python3 .github/scripts/test-ovdb-release.py
      - run: pnpm install --frozen-lockfile
      - name: Check OVDB Changesets generation and release selection
        run: python3 .github/scripts/test-ovdb-release-selection.py
      - run: pnpm check
      - name: Verify HTTP check without pre-existing generated output
        run: pnpm --filter @dalgo/http run check:clean-output
      - run: pnpm --filter @dalgo/firestore run test:emulator

  adapter-git-subdir-consumer:
    # Proves the documented pnpm GitHub subdirectory install works from a Git
    # fetch, where every dependency is prepared in its own fetched workspace.
    # A prebuilt-tarball consumer cannot catch a missing dependency build order.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install, type-check and dynamically import from a Git subdirectory
        env:
          DALGO_GIT_SUBDIR_RECEIPT: ${{ runner.temp }}/adapter-git-subdir-consumer/receipt.json
        run: pnpm check:git-subdir-consumer
      - name: Retain Git-subdirectory consumer receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adapter-git-subdir-consumer-${{ github.sha }}
          path: ${{ runner.temp }}/adapter-git-subdir-consumer
          if-no-files-found: ignore

  adapter-packed-consumer:
    # Proves the published-tarball consumer path for every browser adapter,
    # including the new Typesense package: only the packed tarballs and the exact
    # modern @dalgo/core commit, strict peers, skipLibCheck false, no legacy
    # @dal-go/dalgo and no workspace hoisting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack, install, type-check and import the public adapter tarballs
        run: pnpm check:packed-consumer

  ovdb-artifact:
    # Pinned to ubuntu-24.04: the pinned playwright 1.58.2 does not support
    # ubuntu-26.04-x64, which ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.0.0'
      - run: echo "OVDB_NODE20=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache-dependency-path: .github/fixtures/ovdb-yaml-parity/go.sum
      - run: pnpm --filter @dalgo/ovdb check
      - name: Verify native YAML string parity with the released Go parser
        run: node .github/scripts/check-ovdb-yaml-parity.mjs
      - name: Verify exact query-only artifact under Node 20, Node 24 and Chromium
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          version=$(jq -r '.version' packages/ovdb/package.json)
          artifact="$RUNNER_TEMP/ovdb-artifact"
          consumer="$RUNNER_TEMP/ovdb-consumer"
          node .github/scripts/prepare-ovdb-release.mjs pack "$artifact" "$source_sha" "$version"
          receipt="$artifact/packed-artifact.json"
          tarball=$(jq -r '.tarball' "$receipt")
          EXPECTED_SOURCE_SHA="$source_sha" EXPECTED_PACKAGE_VERSION="$version" \
            EXPECTED_ARTIFACT_SHA256="$(jq -r '.sha256' "$receipt")" \
            EXPECTED_ARTIFACT_INTEGRITY="$(jq -r '.integrity' "$receipt")" \
            node .github/scripts/check-ovdb-core-matrix.mjs "$tarball" "$consumer" "$OVDB_NODE20" "$(command -v node)"
          cp "$consumer/artifact-receipt.json" "$artifact/tested-artifact.json"
          node .github/scripts/prepare-ovdb-release.mjs verify "$artifact" "$source_sha" "$version" "$artifact/tested-artifact.json"
      - name: Retain OVDB consumer and artifact receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ovdb-artifact-${{ github.sha }}
          path: ${{ runner.temp }}/ovdb-artifact
          if-no-files-found: ignore

  bigquery-core-matrix:
    # Pinned to ubuntu-24.04: the pinned playwright 1.58.2 does not support
    # ubuntu-26.04-x64, which ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.0.0'
      - run: echo "BIGQUERY_NODE20=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dalgo/bigquery --filter @dalgo/http --filter @dalgo/ovdb check
      - name: Verify every supported core and the strict shared-core browsers
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          version=$(jq -r '.version' packages/bigquery/package.json)
          artifact="$RUNNER_TEMP/bigquery-core-artifact"
          consumer="$RUNNER_TEMP/bigquery-core-consumer"
          node .github/scripts/prepare-bigquery-release.mjs pack "$artifact" "$source_sha" "$version"
          receipt="$artifact/packed-artifact.json"
          tarball=$(jq -r '.tarball' "$receipt")
          EXPECTED_SOURCE_SHA="$source_sha" EXPECTED_PACKAGE_VERSION="$version" \
            EXPECTED_ARTIFACT_SHA256="$(jq -r '.sha256' "$receipt")" \
            EXPECTED_ARTIFACT_INTEGRITY="$(jq -r '.integrity' "$receipt")" \
            node .github/scripts/check-bigquery-core-matrix.mjs "$tarball" "$consumer" "$BIGQUERY_NODE20" "$(command -v node)"
          cp "$consumer/artifact-receipt.json" "$artifact/tested-artifact.json"
          node .github/scripts/prepare-bigquery-release.mjs verify "$artifact" "$source_sha" "$version" "$artifact/tested-artifact.json"
      - name: Retain BigQuery compatibility receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigquery-core-${{ github.sha }}
          path: ${{ runner.temp }}/bigquery-core-artifact
          if-no-files-found: ignore

  sqlite-wasm-browsers:
    # The /opfs layer of @dalgo/sqlite-wasm in real browsers. Runs only when
    # sqlite-wasm, sqlite-sql, the lockfile or this workflow changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select changes to sqlite-wasm or sqlite-sql
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -Eq '^(packages/(sqlite-wasm|sqlite-sql)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Fetch the pinned Chinook file and verify its SHA-256
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/chinook.sqlite"
          curl -fsSL --retry 3 -o "$file" https://chinook.demodb.dev/data/chinook.sqlite
          echo "7651ba378ac2fcd0dfc3c66fb101f7a7eed3ba39a612ec642b96e20702061f15  $file" | sha256sum -c -
          echo "CHINOOK_SQLITE=$file" >> "$GITHUB_ENV"
      - name: Build sqlite-sql and sqlite-wasm
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter "@dalgo/sqlite-wasm..." run build
      - name: Chinook unit tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @dalgo/sqlite-wasm exec vitest run test/chinook.test.ts
      # WebKit is not run here: it needs a persistent profile for OPFS, and
      # on Linux runners a persistent WebKit context aborts MiniBrowser when
      # the suite opens a second page. It is verified locally on macOS.
      - name: Install Chromium and Firefox
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @dalgo/sqlite-wasm exec playwright install --with-deps chromium firefox
      - name: Playwright suite in Chromium and Firefox
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @dalgo/sqlite-wasm test:browser --project=chromium --project=firefox
      - name: Retain Playwright results
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-wasm-browsers-${{ github.sha }}
          path: packages/sqlite-wasm/test-results
          if-no-files-found: ignore

  postgrest-browsers:
    # Real Chromium -> real PostgREST CORS/header/paging proof. The script owns
    # a disposable loopback Compose project and a unique static origin. Runs
    # only when postgrest, its adapter-runtime dependency, the lockfile or this
    # workflow changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select changes to postgrest
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -Eq '^(packages/(postgrest|adapter-runtime)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @dal-go/dalgo2postgrest exec playwright install --with-deps chromium
      - name: Real browser against disposable PostgREST
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @dal-go/dalgo2postgrest test:browser
      - name: Retain Playwright results
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgrest-browsers-${{ github.sha }}
          path: packages/postgrest/test-results
          if-no-files-found: ignore

  libsql-real-and-browser:
    # Account-free, commit-pinned libSQL server: real Hrana reads, a real reader
    # JWT write probe, and a genuine Chromium cross-origin fetch. The scripts own
    # their loopback container, ephemeral Ed25519 keys and teardown. Runs only
    # when libsql, its adapter-runtime dependency, the lockfile or CI changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select changes to libsql
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -Eq '^(packages/(libsql|adapter-runtime)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @dal-go/dalgo2libsql exec playwright install --with-deps chromium
      - name: Real libSQL server over Hrana HTTP
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @dal-go/dalgo2libsql test:real
      - name: Real Chromium against disposable libSQL
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @dal-go/dalgo2libsql test:browser
      - name: Retain Playwright results
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libsql-browsers-${{ github.sha }}
          path: packages/libsql/test-results
          if-no-files-found: ignore

  typesense-real-and-browser:
    # Account-free, digest-pinned Typesense 30.2: ordinary native full-text with
    # an exact uint64 decimal score, real Node reads and a genuine Chromium
    # cross-origin fetch/CORS proof. The fixture owns a disposable loopback
    # container, a random Docker-published port, a random static page origin and
    # exact teardown verification. This job is required and never
    # continue-on-error: no mocked or intercepted provider response is accepted.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the pinned Typesense image metadata
        run: docker manifest inspect typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110 >/dev/null
      - name: Install Chromium
        run: pnpm --filter @dal-go/dalgo2typesense exec playwright install --with-deps chromium
      - name: Real Typesense 30.2 over the Node SDK
        run: pnpm --filter @dal-go/dalgo2typesense test:real
      - name: Real Chromium Typesense SDK native fetch and CORS
        run: pnpm --filter @dal-go/dalgo2typesense test:browser
      - name: Retain Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typesense-browsers-${{ github.sha }}
          path: packages/typesense/test-results
          if-no-files-found: ignore
